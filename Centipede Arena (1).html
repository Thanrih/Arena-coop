const flyers=[],FLYER_HEIGHT=1.3;
function spawnFlyer(){const h=B.chain[0],g=new T.Group(),fm=mat(0x44cc88,0x114422),b=new T.Mesh(new T.SphereGeometry(.4,10,8),fm);b.castShadow=true;g.add(b);
  const ey=new T.Mesh(new T.SphereGeometry(.12,6,6),mat(0xff2222,0xff0000));ey.position.set(0,.1,.35);g.add(ey);
  const w=[-1,1].map(x=>{const p=new T.Group(),m=new T.Mesh(new T.BoxGeometry(1.1,.04,.6).translate(x*.55,0,0),mat(0xaaffcc,0x226644));p.add(m);g.add(p);return p});
  g.position.set(h.x,FLYER_HEIGHT,h.z);scene.add(g);flyers.push({g,hp:20*bossDifficulty.health,w,t:rnd(0,9),a:rnd(0,6.28),dir:Math.random()<.5?1:-1,cd:rnd(2,4),dive:0,v:new T.Vector3(rnd(-6,6),0,rnd(-6,6)),f:0,b})}

function pickAttack(){const a=B.chain[K0],d=Math.hypot(P.pos.x-a.x,P.pos.z-a.z),o=['laser'];if(flyers.length<8)o.push('spawn');if(d<12)o.push('swipe','swipe');
  B.state=o[Math.floor(Math.random()*o.length)];B.st=0;B.sp=0;B.a0=Math.atan2(P.pos.x-a.x,P.pos.z-a.z)}
const swA=(t,a0)=>t<1?a0+1.1*sm(t):t<1.6?a0+1.1-2.4*(1-Math.pow(1-(t-1)/.6,3)):a0-1.3;

function updBoss(dt){
  const b=B,hd=b.chain[0],rage=b.hp<b.max*.5?1.25:1;b.t+=dt;
  let spd=8*rage,turn=1.7*rage,rt=0,jt=0,mt=0,w=0;
  const toP=Math.atan2(P.pos.x-hd.x,P.pos.z-hd.z),dP=Math.hypot(P.pos.x-hd.x,P.pos.z-hd.z);
  let des=toP+Math.sin(b.t*1.2)*.9*Math.min(1,dP/10);
  if(Math.hypot(hd.x,hd.z)>arenaRadius-7)des=Math.atan2(-hd.x,-hd.z);
  const done=()=>{b.state='chase';b.next=rnd(2,3.5)/rage};
  b.warn=0;beam.visible=false;
  if(b.state=='chase'){b.next-=dt;if(b.next<=0)pickAttack()}
  else if(b.state=='spawn'){b.st+=dt;spd=2.5;rt=1;mt=1;jt=1;if(b.sp<(rage>1?5:4)&&b.st>.7+b.sp*.35){b.sp++;spawnFlyer();burst(hd.x,3.5,hd.z,0x44cc88,8)}if(b.st>2.8)done()}
  else if(b.state=='laser'){b.st+=dt;des=toP;rt=.12;const f=b.st>1.4;spd=f?1.5:1;turn=f?.32*rage:2.6;mt=f?1:b.st/1.4;jt=f?1:.4;
    const L=arenaRadius+13,dx=Math.sin(b.h),dz=Math.cos(b.h);beam.visible=true;beam.position.set(hd.x+dx*1.4,1,hd.z+dz*1.4);beam.rotation.y=b.h;
    const wd=f?.38*(1+.15*Math.sin(b.t*60)):.05;beam.scale.set(wd,wd,L);beam.material.opacity=f?.85:.4;
    if(f&&!over){const rx=P.pos.x-hd.x,rz=P.pos.z-hd.z,t=rx*dx+rz*dz,dist=Math.abs(rx*dz-rz*dx);
      forEachPlayer(()=>{const rx=P.pos.x-hd.x,rz=P.pos.z-hd.z,t=rx*dx+rz*dz,dist=Math.abs(rx*dz-rz*dx);if(t>0&&t<L&&dist<.8&&P.pos.y<1.35){P.hp-=32*dt/bossDifficulty.attacks;shake=.25;if(P.hp<=0)playerDied()}})}
    if(b.st>3.5)done()}
  else if(b.state=='swipe'){b.st+=dt;spd=2.5;turn=.9;const t=b.st;w=t<.4?t/.4:t<1.6?1:Math.max(0,1-(t-1.6));b.warn=t<1.6?1:0;if(t>2.6)done()}
  b.w=w;
  const moveDt=bossMovementTime(dt),d=ad(b.h,des);b.h+=Math.sign(d)*Math.min(Math.abs(d),turn*moveDt);
  b.vs+=(spd-b.vs)*Math.min(1,dt*4);hd.x+=Math.sin(b.h)*b.vs*moveDt;hd.z+=Math.cos(b.h)*b.vs*moveDt;b.travel+=b.vs*moveDt;
  for(let i=1;i<N;i++){const p=b.chain[i],q=b.chain[i-1];tmp.set(p.x-q.x,0,p.z-q.z);const l=tmp.length()||1;p.x=q.x+tmp.x/l*SP;p.z=q.z+tmp.z/l*SP}
  const k=Math.min(1,dt*4);b.rear+=(rt-b.rear)*k;b.mouth+=(mt-b.mouth)*k;b.jaw+=(jt-b.jaw)*k;
  // display positions (cauda controlada pelo rabada procedural)
  for(let i=0;i<N;i++)b.disp[i].copy(b.chain[i]);
  const an=b.chain[K0],t=b.st,sw=b.state=='swipe'&&w>0;
  if(sw)for(let j=K0+1;j<N;j++){const n=j-K0,ang=swA(Math.max(0,t-n*.035),b.a0),p=b.disp[j];
    p.x+=(an.x+Math.sin(ang)*n*SP-p.x)*w;p.z+=(an.z+Math.cos(ang)*n*SP-p.z)*w}
  for(let i=0;i<N;i++){const s=b.segs[i].s;let y=.95*s+.2*Math.sin(b.t*2.5-i*.5)+b.rear*4.5*Math.pow(Math.max(0,1-i/9),1.6);
    if(sw&&i>K0)y+=w*(t<1?1.6*sm(t):.3)*((i-K0)/10);b.Y[i]=y}
  for(let i=0;i<N;i++){const o=b.segs[i],p=b.disp[i],a=i?b.disp[i-1]:p,c=i?p:b.disp[1],dx=(i?a.x-p.x:p.x-c.x),dz=(i?a.z-p.z:p.z-c.z),dy=i?b.Y[i-1]-b.Y[i]:b.Y[0]-b.Y[1];
    o.root.position.set(p.x,b.Y[i],p.z);o.root.rotation.y=Math.atan2(dx,dz);o.tilt.rotation.x=-Math.atan2(dy,Math.hypot(dx,dz));
    for(const l of o.legs){const ph=b.travel*1.6-i*.55+(l.sd>0?Math.PI:0);l.up.rotation.y=Math.sin(ph)*.5;l.up.rotation.z=.45+Math.max(0,Math.cos(ph))*.5+Math.sin(b.t*4+i)*.05;l.lo.rotation.z=-1.25-Math.max(0,Math.cos(ph))*.3}
    o.f=Math.max(0,o.f-dt*5);const wr=i>K0?b.warn*(.4+.3*Math.sin(b.t*30)):0;o.bm.emissive.setRGB(Math.max(o.f,wr),o.f,o.f)}
  const h=b.segs[0];h.mand.forEach(m=>m.rotation.y=m.userData.sd*(.3+b.jaw*.7+Math.sin(b.t*7)*.08));
  h.ant.forEach(a=>{a.rotation.y=a.userData.sd*(.3+Math.sin(b.t*3)*.15);a.rotation.x=-.4+Math.sin(b.t*2.3+a.userData.sd)*.15});
  h.glow.scale.setScalar(.05+b.mouth*.5*(1+.15*Math.sin(b.t*30)));
  h.eyes.forEach(e=>e.scale.setScalar(1+b.mouth*.5));
  // contato com o jogador
  forEachPlayer(()=>{for(let i=0;i<N;i++){const p=b.disp[i];if(Math.hypot(P.pos.x-p.x,P.pos.z-p.z)<b.segs[i].s*.8+.45&&P.pos.y<b.Y[i]+.9){hurt(i==0?15:10,p);break}}})
  if(b.state=='swipe'&&t>1&&t<1.65)forEachPlayer(()=>{for(let j=K0+1;j<N;j++){const p=b.disp[j];if(Math.hypot(P.pos.x-p.x,P.pos.z-p.z)<1.2&&P.pos.y<1.7){hurt(22,p);break}}})
}

const A={on:false,u:[],ar:[],wave:-1,total:0,killed:0,t:0};
const W=[[4,2,2],[5,3,3],[6,4,4]],bone=mat(0xe8e2cc,0x161410),dark=mat(0x111111),steel=mat(0xaab4c0),

function mkSkel(type){
  const g=new T.Group(),r=new T.Group(),u={type,g,r,id:uid++,hp:(type=='w'?40:type=='a'?20:30)*bossDifficulty.health,ph:0,state:'walk',st:0,cd:rnd(.5,2),f:0,rise:0,dead:0,face:0,hit:0,sd:Math.random()<.5?1:-1,lock:0};

  if(type=='h'){
    const wh=new T.Group(),tm=mat(0x5a3b22);wh.position.y=.7;u.tire=new T.Mesh(new T.CylinderGeometry(.7,.7,.25,16).rotateZ(Math.PI/2),tm);wh.add(u.tire);
    for(let k=0;k<3;k++){const s=new T.Mesh(new T.BoxGeometry(.2,1.4,.1),dark);s.rotation.x=k*Math.PI/3;wh.add(s)}
    g.add(wh);r.position.y=.5;u.wheel=wh;

  }else{

  }

    const sh=new T.Mesh(new T.BoxGeometry(.08,.7,.55),mat(0x6b4a2a));sh.position.set(-.1,-.45,.1);aL.add(sh)}
  if(type=='a'){const bg=new T.Group(),bw=new T.Mesh(new T.TorusGeometry(.6,.04,6,14,Math.PI),mat(0x7a5530));bw.rotation.z=-Math.PI/2;bg.add(bw);bg.rotation.y=-Math.PI/2;bg.position.y=-.7;aL.add(bg)}
  g.traverse(o=>o.castShadow=true);return u}
function armySizeMultiplier(){return MODE===2?2:1}
function spawnWave(){A.wave++;const c=W[A.wave],multiplier=armySizeMultiplier();
  ['w','a','h'].forEach((t,k)=>{for(let i=0;i<c[k]*multiplier;i++){const u=mkSkel(t);let x,z,n=0;
    do{const a=rnd(0,6.283);x=Math.sin(a)*(arenaRadius-6);z=Math.cos(a)*(arenaRadius-6)}while(Math.hypot(x-P.pos.x,z-P.pos.z)<12&&n++<20);
    u.rise=-rnd(0,.7);u.g.position.set(x,-2.2,z);scene.add(u.g);A.u.push(u)}})}
function startArmy(){A.on=true;A.total=W.flat().reduce((a,b)=>a+b,0)*armySizeMultiplier();healTeam();spawnWave();
  document.getElementById('bt').textContent='EXÉRCITO DE ESQUELETOS';document.getElementById('bb').style.background='#d8d2b0';
  const n=document.getElementById('bn');n.style.display='block';setTimeout(()=>n.style.display='none',3500)}
function updArmy(dt){
  if(!A.on)return;A.t+=dt;
  const alive=A.u.filter(u=>!u.dead).length;
  if(A.wave<2&&alive<=(A.wave<0?0:3))spawnWave();else if(A.wave==2&&alive==0&&!R.on&&!over){if(MODE==2)finish(true);else startRobot()};
  for(let i=A.u.length-1;i>=0;i--){const u=A.u[i],g=u.g;
    if(u.dead){u.dead+=dt;g.rotation.x=-Math.min(1.5,u.dead*5);if(u.dead>.8)g.position.y-=dt*2;if(u.dead>1.6){scene.remove(g);A.u.splice(i,1)}continue}
    if(u.rise<1){u.rise+=dt*.8;g.position.y=-2.2*(1-sm(Math.min(1,Math.max(0,u.rise))));continue}
    selectTarget(g.position,u,dt/bossDifficulty.attacks);
    const dx=P.pos.x-g.position.x,dz=P.pos.z-g.position.z,d=Math.hypot(dx,dz),ang=Math.atan2(dx,dz);
    let mx=0,mz=0,tf=ang,posed=false,lean=0;u.f=Math.max(0,u.f-dt);u.cd-=dt;
    if(u.type=='w'){
      if(u.state=='walk'){tf=ang+Math.sin(A.t*2+u.id)*.3;if(d>1.6){mx=Math.sin(tf)*5.5;mz=Math.cos(tf)*5.5}if(d<2&&u.cd<=0){u.state='atk';u.st=0;u.hit=0}}
      else{posed=true;u.st+=dt;const s=u.st;u.aR.rotation.x=s<.4?-2.5*sm(s/.4):-2.5+3.8*sm(Math.min(1,(s-.4)/.12));u.aL.rotation.x=-.8;
        if(s>.5&&!u.hit){u.hit=1;if(d<2.4&&P.pos.y<1.6)hurt(10,g.position)}if(s>1){u.state='walk';u.cd=1.1}}
    }else if(u.type=='a'){
      if(u.state=='walk'){const dir=d<10?-1:d>16?1:0;
        if(dir){mx=Math.sin(ang)*dir*5;mz=Math.cos(ang)*dir*5}else{mx=Math.cos(ang)*u.sd*3;mz=-Math.sin(ang)*u.sd*3}
        if(u.cd<=0){u.state='draw';u.st=0}}
      else{posed=true;u.st+=dt;u.aL.rotation.x=-1.5;u.aR.rotation.x=-1.5+Math.min(1,u.st)*.4;u.sk.rotation.x=.1;
        if(u.st>1.1){const l=.45*d/20,ax=P.pos.x+P.vx*l-g.position.x,az=P.pos.z+P.vz*l-g.position.z,al=Math.hypot(ax,az)||1;
          const m=new T.Mesh(arG,arM);m.position.set(g.position.x+ax/al,1.4,g.position.z+az/al);m.rotation.y=Math.atan2(ax,az);scene.add(m);
          EP.push({m,v:new T.Vector3(ax/al*20,0,az/al*20),l:3,k:'a',o:'e',t:0,dmg:8});u.state='walk';u.cd=rnd(2,3.2)}}
    }else{

      if(u.state=='walk'){mx=Math.sin(ang)*4;mz=Math.cos(ang)*4;if(u.cd<=0&&d<20){u.state='aim';u.st=0}}

        if(u.st>1.2){u.state='dash';u.st=0;u.hit=0}}

        if(u.st>1||Math.hypot(g.position.x,g.position.z)>29.5){u.state='rest';u.st=0}}
      else{u.st+=dt;lean=-.15;if(u.st>1.4){u.state='walk';u.cd=rnd(1,2.5)}}

    if(u.legs){u.legs[0].rotation.x=Math.sin(u.ph)*.8*am;u.legs[1].rotation.x=-u.legs[0].rotation.x}
    if(!posed){u.aL.rotation.x=-Math.sin(u.ph)*.7*am;u.aR.rotation.x=Math.sin(u.ph)*.7*am;u.sk.rotation.x=0}
    if(u.wheel)u.wheel.rotation.x+=sp*moveDt/.7;
    u.r.rotation.x=u.wheel?lean:am*.15;u.sk.rotation.z=Math.sin(A.t*14+u.id)*.06;u.r.scale.setScalar(1+u.f*3);

    const a=p.g.position,b=q.g.position,dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<1.3&&d>.001){const k=(1.3-d)*.5;a.x-=dx/d*k;a.z-=dz/d*k;b.x+=dx/d*k;b.z+=dz/d*k}}
}

let aimY=1.3,hs=0;
const R={on:false,g:new T.Group(),hp:1800,max:1800,vx:0,vz:0,state:'land',st:0,par:0,stun:0,t:0,f:0,dead:false,dt:0,face:0,hover:1,open:0,dr:0,rec:[0,0],vol:0,fc:0,lock:0,spin:0,sd:1,k:0,txt:''};

function gGeo(b,p){const s=atob(b),n=s.length/10,po=new Float32Array(n*9),co=new Float32Array(n*9);for(let i=0;i<n;i++){const o=i*10,c=GOL.PAL[s.charCodeAt(o+9)];for(let k=0;k<9;k++){let v=s.charCodeAt(o+k);if(v>127)v-=256;po[i*9+k]=v-p[k%3];co[i*9+k]=c[k%3]}}

  if(!started){cam.position.set(0,30,37);cam.lookAt(0,0,20);WT.value=performance.now()/1000;grassSystem.update(dt,[]);ren.setRenderTarget(rt);ren.render(scene,cam);ren.setRenderTarget(null);ren.render(pS,pC);return}if(paused){ren.setRenderTarget(rt);ren.render(scene,cam);ren.setRenderTarget(null);ren.render(pS,pC);return}if(guestOnly){guestFrame(dt);return}if(hs>0){hs-=dt;dt*=.06}
  P=localPlayer;
  ray.setFromCamera(mouse,cam);{const hh=ray.intersectObjects(picks(),true).find(h=>h.object.material!==lineM);if(hh){aim.copy(hh.point);aimY=hh.point.y}else if(ray.ray.intersectPlane(plane,tmp)){aim.copy(tmp);aimY=P.pos.y+1.3}}
  simulatePlayers(dt);
  if(!B.dead){advanceBoss(updBoss,dt,B.chain[0]);} else{B.dt+=dt;beam.visible=false;
    B.segs.forEach((o,i)=>{if(!o.gone&&B.dt>i*.09){o.gone=true;o.root.visible=false;const p=B.disp[i];burst(p.x,B.Y[i],p.z,0xff8833,14,9);shake=.4}});
    if(MODE!==5&&B.dt>N*.09+.5&&!A.on){if(MODE==1){if(!over)finish(true)}else startArmy()}}
  // balas
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.m.position.addScaledVector(b.d,40*dt);b.l-=dt;let hit=b.l<=0||b.m.position.y<0;
    if(!hit&&!B.dead)for(let j=0;j<N;j++){const p=B.disp[j],s=B.segs[j];if(Math.hypot(b.m.position.x-p.x,b.m.position.z-p.z)<.8*s.s+.25&&Math.abs(b.m.position.y-B.Y[j])<.9*s.s+.3){
      B.hp-=j==0?15:8;s.f=.8;hit=true;burst(b.m.position.x,b.m.position.y,b.m.position.z,0xffcc44,4,4);if(B.hp<=0){B.hp=0;B.dead=true;B.state='dead';flyers.forEach(f=>{scene.remove(f.g)});flyers.length=0}break}}
    if(!hit)for(let j=flyers.length-1;j>=0;j--){const f=flyers[j];if(b.m.position.distanceTo(f.g.position)<.9){f.hp-=10;f.f=.15;hit=true;
      if(f.hp<=0){shatterModel(f.g,32);burst(f.g.position.x,f.g.position.y,f.g.position.z,0x44ff99,12);scene.remove(f.g);flyers.splice(j,1)}break}}
    if(!hit)for(const u of A.u){if(!u.dead&&u.rise>=1&&Math.hypot(b.m.position.x-u.g.position.x,b.m.position.z-u.g.position.z)<.8&&b.m.position.y<2.2){
      u.hp-=10;u.f=.15;hit=true;burst(b.m.position.x,b.m.position.y,b.m.position.z,0xeeeecc,5,4);if(u.hp<=0){u.dead=.001;A.killed++;burst(u.g.position.x,1.2,u.g.position.z,0xeeeecc,12,6)}break}}
    if(!hit&&R.on&&!R.dead&&Math.hypot(b.m.position.x-rg.position.x,b.m.position.z-rg.position.z)<3.3&&b.m.position.y>.3&&b.m.position.y<8.5){robotHurt(10);hit=true;burst(b.m.position.x,b.m.position.y,b.m.position.z,R.stun>0?0xffdd55:0xcccccc,4,5)}
    if(!hit&&E.on&&!E.dead&&Math.hypot(b.m.position.x-eg.position.x,b.m.position.z-eg.position.z)<2.7&&b.m.position.y>eg.position.y&&b.m.position.y<eg.position.y+7){ettinHurt(10);hit=true;burst(b.m.position.x,b.m.position.y,b.m.position.z,0xffaa44,4,5)}
    if(hit){scene.remove(b.m);bullets.splice(i,1)}}
  // voadores (batida de asas procedural)
  for(const f of flyers){selectTarget(f.g.position,f,dt);f.t+=dt;f.a+=dt*1.2*f.dir;f.cd-=dt;if(f.cd<0){f.dive=1;f.cd=rnd(3,5)}f.dive=Math.max(0,f.dive-dt);
    if(f.dive>0)tmp.set(P.pos.x,FLYER_HEIGHT,P.pos.z);else tmp.set(P.pos.x+Math.cos(f.a)*4.5,FLYER_HEIGHT,P.pos.z+Math.sin(f.a)*4.5);
    f.v.addScaledVector(tmp.sub(f.g.position),(f.dive>0?5:2)*dt);f.v.multiplyScalar(1-dt*1.3);if(f.v.length()>(f.dive>0?12:8))f.v.setLength(f.dive>0?12:8);
    f.g.position.addScaledVector(f.v,dt);f.g.position.y=FLYER_HEIGHT;f.v.y=0;f.g.rotation.y=Math.atan2(f.v.x,f.v.z);f.g.rotation.z=Math.sin(f.t*3)*.1;
    const fl=Math.sin(f.t*24)*.9;f.w[0].rotation.z=fl;f.w[1].rotation.z=-fl;f.b.scale.y=1+Math.sin(f.t*24)*.08;f.f=Math.max(0,f.f-dt);f.b.material.emissive.setRGB(f.f*6,.07+f.f*3,.13);
    forEachPlayer(()=>{if(!over&&f.g.position.distanceTo(tmp.set(P.pos.x,P.pos.y+1,P.pos.z))<1.1)hurt(8,f.g.position)})}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;p.v.y-=18*dt;p.m.position.addScaledVector(p.v,dt);p.m.scale.setScalar(Math.max(.01,p.l/.6));if(p.l<=0){scene.remove(p.m);parts.splice(i,1)}}
  updateEnemyDeaths();advanceBoss(updArmy,dt);advanceBoss(updRobot,dt,rg.position);updEttin(dt);updProj(dt);updateSpecialMissiles(dt);updateEnemyDeaths();updateDeathPhysics(dt);P=localPlayer;checkFinalVictory();updateFinalHUD();publishSnapshot();
  // câmera de cima
  shake=Math.max(0,shake-dt*1.5);const hd=finalEncounter?P.pos:R.on?rg.position:A.on?P.pos:B.chain[0];
  look.set(P.pos.x*.75+hd.x*.25,0,P.pos.z*.75+hd.z*.25);updateCamera(dt,look.x,look.z,shake);
  updateTeamUI();
  hb.style.width=Math.max(0,P.hp)+'%';bb.style.width=(finalEncounter?updateFinalHUD():E.on?E.hp/E.max*100:R.on?R.hp/R.max*100:A.on?(1-A.killed/A.total)*100:B.hp/B.max*100)+'%';
  WT.value=performance.now()/1000;grassSystem.update(dt,players.values());ren.setRenderTarget(rt);ren.render(scene,cam);ren.setRenderTarget(null);ren.render(pS,pC);
}

let started=false,MODE=0;
function begin(m){MODE=m;started=true;document.getElementById('menu').style.display='none';updateControls();try{location.hash=m}catch(e){}
  if(m==2||m==3||m===5){B.dead=true;B.dt=999;B.segs.forEach(o=>{o.gone=true;o.root.visible=false});flyers.forEach(f=>scene.remove(f.g));flyers.length=0}
  if(m===5)startEttin();
  if(m==3){A.on=true;A.wave=2;startRobot()}if(m===4)startFinalEncounter()}

 0:['.....bb.....','....bbbb....','.rr..bb..ww.','rrrr.bb.wwww','rrkr.bb.wkww','.rr..bb..ww.','.....bb.....','..yy.bb.yy..','.yyyy..yyyy.','.yyyy..yyyy.','..yy....yy..','............']};
SPR[4]=SPR[0];

document.querySelectorAll('#menu .ic').forEach(c=>{const x=c.getContext('2d');SPR[c.dataset.m].forEach((row,j)=>[...row].forEach((ch,i)=>{if(CL[ch]){x.fillStyle=CL[ch];x.fillRect(i,j,1,1)}}))});

addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(!started&&menuScreen==='single'&&e.key>='1'&&e.key<='6')chooseBoss(e.key==='4'?0:e.key==='5'?4:e.key==='6'?5:Number(e.key));if(e.code=='KeyM'){try{history.replaceState(null,'',location.pathname+location.search)}catch(x){}location.reload()}});

document.getElementById('pause-open-options').onclick=()=>showPausePanel(true);
document.getElementById('pause-options-back').onclick=()=>showPausePanel(false);
